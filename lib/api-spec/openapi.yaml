openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /mizan/invitation:
    get:
      operationId: getMyInvitation
      summary: Read the current browser's private demo wedding invitation
      responses:
        "200":
          description: Invitation or no saved invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationEnvelope" }
    put:
      operationId: saveInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "200":
          description: Saved invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
  /mizan/guests:
    get:
      operationId: listWeddingGuests
      responses:
        "200":
          description: Private guest list for this browser's wedding
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WeddingGuest" }
    post:
      operationId: addWeddingGuest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeddingGuestInput" }
      responses:
        "201":
          description: Guest created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeddingGuest" }
  /mizan/guests/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: editWeddingGuest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeddingGuestInput" }
      responses:
        "200":
          description: Updated guest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeddingGuest" }
    delete:
      operationId: removeWeddingGuest
      responses:
        "204": { description: Guest deleted }
  /mizan/invitations/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPublicInvitation
      responses:
        "200":
          description: Public invitation only, never the guest list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
  /mizan/invitations/{token}/rsvp:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: submitRsvp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RsvpInput" }
      responses:
        "200":
          description: RSVP saved; response key permits this guest to update only their RSVP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RsvpReceipt" }
  /mizan/assistant:
    post:
      operationId: askMizan
      summary: Analyse illustrative wedding finances using deterministic rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantInput"
      responses:
        "200":
          description: Sample analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantReply"
        "400":
          description: Invalid input
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    InvitationInput:
      type: object
      required: [template, coupleNames, eventName, date, time, venue, location, message, language, allowPlusOnes, maxParty]
      properties:
        template: { type: string, enum: [heritage, garden, modern] }
        coupleNames: { type: string, minLength: 1, maxLength: 160 }
        eventName: { type: string, minLength: 1, maxLength: 120 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: Calendar date YYYY-MM-DD without timezone conversion }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        venue: { type: string, minLength: 1, maxLength: 160 }
        location: { type: string, minLength: 1, maxLength: 240 }
        message: { type: string, maxLength: 2000 }
        language: { type: string, enum: [en, ar] }
        allowPlusOnes: { type: boolean }
        maxParty: { type: integer, minimum: 1, maximum: 20 }
    Invitation:
      allOf:
        - { $ref: "#/components/schemas/InvitationInput" }
        - type: object
          required: [id, eventId, token]
          properties:
            id: { type: string }
            eventId: { type: string }
            token: { type: string }
    InvitationEnvelope:
      type: object
      required: [invitation]
      properties:
        invitation:
          oneOf:
            - { $ref: "#/components/schemas/Invitation" }
            - { type: "null" }
    WeddingGuestInput:
      type: object
      required: [name, status, attendees, notes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [pending, attending, declined] }
        attendees: { type: integer, minimum: 0, maximum: 100 }
        notes: { type: string, maxLength: 1000 }
    WeddingGuest:
      allOf:
        - { $ref: "#/components/schemas/WeddingGuestInput" }
        - type: object
          required: [id, eventId, source]
          properties:
            id: { type: string }
            eventId: { type: string }
            source: { type: string, enum: [manual, rsvp] }
    RsvpInput:
      type: object
      required: [name, status, attendees]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [attending, declined] }
        attendees: { type: integer, minimum: 0, maximum: 20 }
        responseKey: { type: string, format: uuid }
    RsvpReceipt:
      type: object
      required: [responseKey, status, attendees]
      properties:
        responseKey: { type: string }
        status: { type: string, enum: [attending, declined] }
        attendees: { type: integer }
    AssistantInput:
      type: object
      required: [message, language, budget, savings, monthlyCapacity, remainingExpenses, monthsRemaining, guestCount]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
        language: { type: string, enum: [en, ar] }
        budget: { type: number, minimum: 0 }
        savings: { type: number, minimum: 0 }
        monthlyCapacity: { type: number, minimum: 0 }
        remainingExpenses: { type: number, minimum: 0 }
        monthsRemaining: { type: number, minimum: 0 }
        guestCount: { type: integer, minimum: 1, maximum: 10000 }
        cateringPerGuest: { type: number, minimum: 0 }
        priorities: { type: string }
        context: { type: string, maxLength: 12000 }
    AssistantReply:
      type: object
      required: [answer, monthlyTarget, shortfall, mode]
      properties:
        answer: { type: string }
        monthlyTarget: { type: number }
        shortfall: { type: number }
        mode: { type: string, enum: [deterministic-demo] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

